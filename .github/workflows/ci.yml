name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: '10.0.400'

      - name: Restore
        shell: pwsh
        run: dotnet restore RootedAndroidGameVM.sln

      - name: Test and build Windows GUI executables
        shell: pwsh
        run: |
          dotnet test RootedAndroidGameVM.sln -c Release --no-restore --filter 'Category!=LocalIntegration&Category!=CleanE2E'
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
          dotnet build RootedAndroidGameVM.sln -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
          dotnet format RootedAndroidGameVM.sln --verify-no-changes --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Format verification failed.' }

      - name: Validate GitHub workflows with pinned actionlint
        shell: pwsh
        run: |
          $version = '1.7.12'
          $archive = Join-Path $env:RUNNER_TEMP "actionlint-$version.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/rhysd/actionlint/releases/download/v$version/actionlint_${version}_windows_amd64.zip" `
            -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9'
          if ($actual -ne $expected) { throw 'actionlint archive checksum mismatch.' }
          $toolRoot = Join-Path $env:RUNNER_TEMP 'actionlint'
          Expand-Archive -LiteralPath $archive -DestinationPath $toolRoot
          Get-ChildItem '.github\workflows' -Filter '*.yml' | ForEach-Object {
            & (Join-Path $toolRoot 'actionlint.exe') $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "actionlint rejected $($_.Name)." }
          }
