name: Signed Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    environment: release
    runs-on: [self-hosted, Windows, X64, rgvm-hyperv]
    timeout-minutes: 90
    steps:
      - name: Check out the immutable tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: '10.0.400'

      - name: Verify runner and tag prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Command python.exe -ErrorAction Stop | Out-Null
          $signTool = Get-Command signtool.exe -ErrorAction SilentlyContinue
          $signToolPath = if ($signTool) { $signTool.Source } else { $null }
          if (-not $signToolPath) {
            $kitsRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
            $signTool = Get-ChildItem -LiteralPath $kitsRoot -Filter signtool.exe -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName.EndsWith('x64\signtool.exe', [StringComparison]::OrdinalIgnoreCase) } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            $signToolPath = $signTool.FullName
          }
          if (-not $signToolPath) { throw 'Windows SDK x64 signtool.exe is unavailable.' }
          (Split-Path -Parent $signToolPath) | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          if ((dotnet --version).Trim() -ne '10.0.400') { throw 'The pinned .NET SDK is unavailable.' }
          $inno = Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $inno)) { throw 'Inno Setup 6.7.3 is required.' }
          $innoRegistration = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq 'Inno Setup version 6.7.3' -and $_.DisplayVersion -eq '6.7.3' } |
            Select-Object -First 1
          if (-not $innoRegistration) { throw 'The installed Inno Setup version is not 6.7.3.' }
          $versionLine = Select-String -LiteralPath 'installer\RootedAndroidGameVM.iss' -Pattern '^#define AppVersion "([^"]+)"$'
          $version = $versionLine.Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match installer version $version."
          }

      - name: Provision hash-locked SPDX validator before signing key access
        shell: pwsh
        run: .\build\Prepare-SpdxValidator.ps1

      - name: Import trusted Authenticode certificate
        id: certificate
        shell: pwsh
        env:
          RGVM_PFX_BASE64: ${{ secrets.RGVM_CODESIGN_PFX_BASE64 }}
          RGVM_PFX_PASSWORD: ${{ secrets.RGVM_CODESIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:RGVM_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:RGVM_PFX_PASSWORD)) {
            throw 'Release signing secrets are unavailable.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'rgvm-release-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:RGVM_PFX_BASE64))
          $expectedThumbprint = $null
          $wasPresent = $false
          try {
            $preview = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $pfxPath,
              $env:RGVM_PFX_PASSWORD,
              [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
            $expectedThumbprint = $preview.Thumbprint
            $wasPresent = Test-Path -LiteralPath "Cert:\CurrentUser\My\$expectedThumbprint"
            $preview.Dispose()
            if ($wasPresent) {
              throw 'Signing runner certificate store must not already contain the Release certificate.'
            }
            $password = ConvertTo-SecureString $env:RGVM_PFX_PASSWORD -AsPlainText -Force
            $imported = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
            $signingCertificate = $imported | Where-Object {
              $_.Thumbprint -eq $expectedThumbprint -and $_.HasPrivateKey
            } | Select-Object -First 1
            if (-not $signingCertificate) { throw 'Imported signing certificate has no private key.' }
          }
          catch {
            if (-not $wasPresent -and $expectedThumbprint) {
              $failedCertificate = Get-Item -LiteralPath "Cert:\CurrentUser\My\$expectedThumbprint" -ErrorAction SilentlyContinue
              if ($failedCertificate) { Remove-Item -LiteralPath $failedCertificate.PSPath -DeleteKey -Force }
            }
            [IO.File]::Delete($pfxPath)
            throw
          }
          "RGVM_CERT_THUMBPRINT=$expectedThumbprint" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RGVM_REMOVE_IMPORTED_CERT=$(if ($wasPresent) { '0' } else { '1' })" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RGVM_PFX_PATH=$pfxPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build, sign, and run every Release gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cleanRoot = Join-Path $env:RUNNER_TEMP "rgvm-clean-$([Guid]::NewGuid().ToString('N'))"
          "RGVM_CLEAN_ROOT=$cleanRoot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          .\build\Build-Release.ps1 `
            -CleanInstallRoot $cleanRoot `
            -SigningCertificateThumbprint $env:RGVM_CERT_THUMBPRINT

      - name: Verify the publishable asset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -LiteralPath 'artifacts\release' -Filter 'RootedAndroidGameVM-Setup-*-x64.exe' -File
          if (@($installer).Count -ne 1) { throw 'Expected exactly one public-named installer.' }
          if (Get-ChildItem -LiteralPath 'artifacts\release' -Filter '*UNSIGNED*' -File) {
            throw 'Unsigned assets cannot enter a public Release.'
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'Valid') { throw "Invalid final signature: $($signature.Status)" }

      - name: Retain the verified Release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: RootedAndroidGameVM-${{ github.ref_name }}
          path: artifacts/release/*
          if-no-files-found: error

      - name: Attest the signed installer provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: artifacts/release/RootedAndroidGameVM-Setup-*-x64.exe

      - name: Create GitHub Release draft for human review
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath 'artifacts\release' -File | ForEach-Object FullName
          gh release create $env:GITHUB_REF_NAME $assets --draft --verify-tag --title "Rooted Android Game VM $env:GITHUB_REF_NAME" --notes-file 'release\CHANGELOG.md'
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release draft creation failed.' }

      - name: Remove temporary signing material
        if: always()
        shell: pwsh
        run: |
          if ($env:RGVM_REMOVE_IMPORTED_CERT -eq '1' -and $env:RGVM_CERT_THUMBPRINT) {
            $certificate = Get-Item -LiteralPath "Cert:\CurrentUser\My\$env:RGVM_CERT_THUMBPRINT" -ErrorAction SilentlyContinue
            if ($certificate) { Remove-Item -LiteralPath $certificate.PSPath -DeleteKey -Force }
          }
          if ($env:RGVM_PFX_PATH -and (Test-Path -LiteralPath $env:RGVM_PFX_PATH)) {
            [IO.File]::Delete($env:RGVM_PFX_PATH)
          }
          if ($env:RGVM_CLEAN_ROOT) {
            $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
            $cleanRoot = [IO.Path]::GetFullPath($env:RGVM_CLEAN_ROOT)
            if ($cleanRoot.StartsWith($runnerTemp, [StringComparison]::OrdinalIgnoreCase) -and
                (Split-Path $cleanRoot -Leaf).StartsWith('rgvm-clean-', [StringComparison]::Ordinal)) {
              if (Test-Path -LiteralPath $cleanRoot) { [IO.Directory]::Delete($cleanRoot, $true) }
            }
          }
